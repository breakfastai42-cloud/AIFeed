<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Intelligence Briefing AI</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/svg+xml" href="/icon-192.svg">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="ethiopian-date" id="ethiopianDate">
          <span class="loading">Loading...</span>
        </div>
        <div class="subtitle">Intelligence Briefing AI</div>
      </div>
      <button class="clear-chat-btn" id="clearChatBtn" title="Clear chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18"></path>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
        </svg>
      </button>
    </header>

    <!-- Chat Messages -->
    <div class="chat-container" id="chatContainer">
      <div class="welcome-message">
        <div class="welcome-icon">🤖</div>
        <h2>Welcome to Intelligence Briefing AI</h2>
        <p>Ask me anything about science, economics, tech, or college admissions. I'll search the web and provide you with live links.</p>
        <div class="suggestion-chips">
          <button class="suggestion-chip" data-prompt="What's the latest breakthrough in quantum computing?">
            🔬 Quantum Computing
          </button>
          <button class="suggestion-chip" data-prompt="Latest macroeconomic policy changes">
            📈 Economics
          </button>
          <button class="suggestion-chip" data-prompt="Top college admissions strategies for Ivy League">
            🎓 Admissions
          </button>
          <button class="suggestion-chip" data-prompt="Latest AI technology trends">
            💻 AI & Tech
          </button>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-container">
      <form class="input-form" id="chatForm">
        <input 
          type="text" 
          id="messageInput" 
          placeholder="Ask me anything..."
          class="message-input"
          autocomplete="off"
        >
        <button type="submit" class="send-btn" id="sendBtn" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 2L11 13"></path>
            <path d="M22 2L15 22L11 13L2 9L22 2"></path>
          </svg>
        </button>
      </form>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
