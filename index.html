<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Intelligence Briefing AI</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/svg+xml" href="/icon-192.svg">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="date" id="date">
          <span class="loading">Loading...</span>
        </div>
        <div class="subtitle">Daily Intelligence Links</div>
      </div>
      <div class="header-actions">
        <button class="action-btn" id="customSearchBtn" title="Custom Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          Custom Search
        </button>
      </div>
    </header>

    <!-- Links Container -->
    <div class="links-container" id="linksContainer">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Fetching daily intelligence links...</p>
      </div>
    </div>

    <!-- Bottom Actions -->
    <div class="bottom-actions">
      <button class="primary-btn" id="getMoreBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6"></path>
          <path d="M1 20v-6h6"></path>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Get More Links
      </button>
    </div>

    <!-- Custom Search Modal -->
    <div class="modal" id="customSearchModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Custom Search</h2>
          <button class="close-btn" id="closeCustomSearchBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18"></path>
              <path d="M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <p class="modal-description">Write a custom instruction to search for specific topics:</p>
          <textarea 
            id="customSearchInput" 
            placeholder="e.g., Find the latest papers on quantum computing breakthroughs from arXiv"
            rows="4"
          ></textarea>
          <button class="primary-btn" id="runCustomSearchBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            Search
          </button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
